# Production: runs the published image from GHCR, never builds.
# This file is self-contained; copy it next to a .env on the host and run:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
services:
  shetu-server:
    # Pin a release (SHETU_IMAGE_TAG=0.0.3) for reproducible deploys; `latest`
    # follows the newest stable release. Multi-arch: linux/amd64, linux/arm64.
    image: ghcr.io/nhridoy/shetu-server:${SHETU_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      # The container always listens on 8080; SHETU_HTTP_PORT controls the
      # host-side port only.
      SHETU_HOST: "0.0.0.0"
      SHETU_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required; set it in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required; set it in .env}
    ports:
      - "${SHETU_BIND_IP:-0.0.0.0}:${SHETU_HTTP_PORT:-8080}:8080"
    volumes:
      # Only used when DATABASE_URL points at SQLite. PostgreSQL deployments
      # can leave this mounted; it stays empty.
      - shetu-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  shetu-data:
