# Local: builds the image from this checkout. Production uses
# docker-compose.prod.yml, which pulls the published image instead.
services:
  shetu-server:
    extends:
      file: docker-compose.prod.yml
      service: shetu-server
    build: .
    # A local tag, so a local build never shadows the published GHCR image.
    image: shetu-server:local

volumes:
  shetu-data:
